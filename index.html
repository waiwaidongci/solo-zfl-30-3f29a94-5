<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古协作调度台</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>水下考古协作调度台</h1>
      <p class="muted">离线运行 · 排班校验 · 任务流转 · 协作合并</p>
    </div>
    <div class="topbar-controls">
      <label class="inline-label" for="siteSelect">遗址</label>
      <select id="siteSelect" data-fkey="siteSelect" aria-label="选择遗址"></select>
      <label class="inline-label" for="actorInput">署名</label>
      <input id="actorInput" data-fkey="actorInput" autocomplete="off" aria-label="操作人署名">
      <div class="btn-row">
        <button id="undoBtn" type="button" title="撤销 (Ctrl+Z)">↩ 撤销</button>
        <button id="redoBtn" type="button" title="重做 (Ctrl+Shift+Z)">↪ 重做</button>
        <button id="importBtn" type="button" title="导入他人导出的 JSON 并合并">导入合并</button>
        <button id="exportBtn" type="button" title="导出全部数据为 JSON">导出</button>
        <button id="helpBtn" type="button" aria-haspopup="dialog" title="键盘快捷键 (按 ? 查看)">?</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="conflictBanner" class="conflict-banner" hidden></div>

  <nav class="tabs" aria-label="主导航">
    <button class="tab" data-tab="schedule" type="button">潜次排期</button>
    <button class="tab" data-tab="tasks" type="button">任务流转</button>
    <button class="tab" data-tab="resources" type="button">资源与天气</button>
    <button class="tab" data-tab="audit" type="button">审计留痕</button>
  </nav>

  <main id="main">
    <section id="panel-schedule" class="panel-page" aria-label="潜次排期"></section>
    <section id="panel-tasks" class="panel-page" aria-label="任务流转" hidden></section>
    <section id="panel-resources" class="panel-page" aria-label="资源与天气" hidden></section>
    <section id="panel-audit" class="panel-page" aria-label="审计留痕" hidden></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/domain.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
